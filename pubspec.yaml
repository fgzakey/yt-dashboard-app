name: yt_dashboard_app
description: "Android companion app for Phil's Library (videos) — same backend, same database."
publish_to: "none"
version: 0.2.0+1

environment:
  # share_plus 13 requires Dart >=3.10 (and Flutter >=3.38.1), so the app can no
  # longer honestly claim to build on 3.3 — raised to match reality.
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  path_provider: ^2.1.3
  share_plus: ^13.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
